<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Математична лабораторія </title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17223a;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px 16px 80px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0 5px}h2{font-size:24px}.muted{color:#64748b}.card{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 4px 20px #1e293b08}button,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:13px 18px;background:#3158c7;color:white;cursor:pointer;font-weight:700;min-height:46px}button.secondary{background:#edf2ff;color:#27479f}button:disabled{opacity:.4}.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.choices{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.choices button{background:#eaf0ff;color:#2544a5;font-size:22px;min-width:65px}.choices button.selected{background:#3158c7;color:white}.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tile{width:44px;height:44px;border-radius:8px;background:#edab42;box-shadow:inset 0 -5px #c88723;cursor:pointer;display:grid;place-items:center;color:#1e293b;font-weight:800}.tile.blue{background:#5aa1df;box-shadow:inset 0 -5px #3678b3}.tile.off{opacity:.22}.progress{height:8px;background:#e3e8f2;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#4a79e3}.tag{display:inline-block;background:#e8f1ff;color:#3158c7;border-radius:30px;padding:5px 11px;font-size:13px}.feedback{min-height:28px;font-weight:650}.teacher{border-left:4px solid #f0b349;background:#fff9ed;padding:15px;border-radius:8px;margin-top:20px}textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;min-height:95px;resize:vertical}select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:white}.field{margin:12px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.small{font-size:13px}.hide{display:none}a{color:#3158c7}hr{border:0;border-top:1px solid #e2e8f0;margin:22px 0}</style></head><body><main><a href="./">← Математика</a><h1>🔢 Математична лабораторія </h1><p class="muted">Урок №1 · Секрети чисел · 30–40 хв · разом із дорослим</p><div class="progress"><div id="bar"></div></div><p id="counter" class="muted"></p><section class="card"><span class="tag" id="stage"></span><h2 id="title"></h2><p id="question"></p><div id="visual"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="row"><button id="check" class="secondary">Перевірити відповідь</button><button id="reveal" class="secondary">Показати пояснення</button></div><div id="explanation" class="teacher hide"></div><details class="teacher" open><summary><strong>👨‍🏫 Панель для батьків</strong></summary><p id="parent"></p><div class="field"><label for="score">Самостійність (0–3)</label><select id="score"><option value="">Не оцінено</option><option value="3">3 — самостійно</option><option value="2">2 — повільно / невпевнено</option><option value="1">1 — з підказкою</option><option value="0">0 — поки не виходить</option></select></div><div class="field"><label for="note">Що помітив(-ла)?</label><textarea id="note" placeholder="Як міркував, що було легко, де потрібна допомога…"></textarea></div><label><input type="checkbox" id="repeat"> Повторити навичку на наступному уроці</label></details></section><div class="nav"><button class="secondary" id="prev">← Назад</button><button id="next">Далі →</button></div><section class="card"><h2>📝 Підсумок уроку</h2><p class="muted">Нотатки автоматично зберігаються лише в цьому браузері. Для перенесення на інший пристрій експортуй результати.</p><label for="summary"><strong>Загальні спостереження</strong></label><textarea id="summary" placeholder="Що сподобалось учню? Що було складно? Що змінити в наступному уроці?"></textarea><div class="row"><button id="export">Експортувати результати (.json)</button><button class="secondary" id="copy">Скопіювати звіт</button></div><p id="exportStatus" class="muted small"></p></section></main><script>
const tasks=[
{stage:"1 · Розігрів",title:"Пропущене число",q:"12 → 13 → ? → 15 → 16",opts:[14,17,11],a:14,parent:"Запитай, як він знайшов число. Не потрібно повторювати всю лічбу до 50.",why:"Між 13 та 15 стоїть 14."},
{stage:"1 · Розігрів",title:"Нова закономірність",q:"2 → 4 → 6 → 8 → ?",opts:[9,10,12],a:10,parent:"Це може бути нова ідея: щоразу додаємо 2. Якщо не знає — поясни, це навчання, не тест.",why:"Кожне наступне число більше на 2."},
{stage:"1 · Розігрів",title:"Знайди помилку",q:"17 → 18 → 20 → 21. Яке число пропустили?",opts:[19,22,16],a:19,parent:"Нехай учень пояснить, де помилка.",why:"Після 18 іде 19."},
{stage:"2 · Різниця",title:"Знайди зайві деталі",q:"У жовтому ряду 6 деталей, у синьому 9. На скільки синіх більше? Натискай деталі, щоб позначити пари.",tiles:[6,9],opts:[2,3,4],a:3,parent:"Покладіть 6 і 9 справжніх LEGO парами. Покажи три сині без пари. Це і є різниця.",why:"Шість синіх мають жовту пару. Три сині залишилися без пари."},
{stage:"2 · Різниця",title:"Друга перевірка",q:"У першій команді 4 деталі, у другій 6. На скільки більше у другій?",tiles:[4,6],opts:[1,2,3],a:2,parent:"Спочатку дозволь зіставити пари, потім запропонуй спробувати подумки.",why:"6 − 4 = 2."},
{stage:"2 · Різниця",title:"Третя перевірка",q:"У першій команді 5 деталей, у другій 8. На скільки більше у другій?",tiles:[5,8],opts:[2,3,4],a:3,parent:"Не підказуй відповідь. Запитай, як можна перевірити.",why:"8 − 5 = 3."},
{stage:"2 · Різниця",title:"Фінальна пара",q:"У першій команді 7 деталей, у другій 10. На скільки більше у другій?",tiles:[7,10],opts:[2,3,4],a:3,parent:"Якщо вийшло легко, запитай: скільки треба додати до 7, щоб стало 10?",why:"10 − 7 = 3."},
{stage:"3 · Склад числа",title:"Розділи вісім",q:"Візьми 8 LEGO. Розділи їх на дві непорожні купки трьома різними способами. Коли готово — натисни «Готово».",opts:["Готово"],a:"Готово",parent:"Попроси назвати принаймні три різні розклади: наприклад 1+7, 2+6, 3+5, 4+4. Не вимагай усі.",why:"Вісім можна скласти з різних пар чисел. Важливо пояснити, що загальна кількість не змінюється."},
{stage:"3 · Склад числа",title:"Сховані деталі",q:"Було 8 LEGO. Ти бачиш 6. Скільки сховано?",opts:[1,2,3],a:2,parent:"Спочатку покажи всі 8, потім сховай 2. Наступний раз спробуй без показу.",why:"6 + 2 = 8."},
{stage:"3 · Склад числа",title:"Ще один секрет",q:"Було 9 деталей. Видно 5. Скільки сховано?",opts:[3,4,5],a:4,parent:"Запитай, чи можна знайти відповідь без перерахунку всіх дев'яти.",why:"5 + 4 = 9."},
{stage:"4 · Історії",title:"Динозаврові яйця",q:"У першому гнізді 6 яєць, у другому 9. Чи можна перекласти яйця між гніздами так, щоб їх стало порівну, нічого не додаючи й не забираючи?",opts:["Так","Ні"],a:"Ні",parent:"Це складна задача-пастка. Дозволь 15 LEGO і експерименти. Якщо складно, підведи до ідеї непарної суми.",why:"Разом 15 яєць. На дві рівні цілі купки 15 не поділити."},
{stage:"4 · Історії",title:"LEGO-магазин",q:"У тебе 10 монет. Машинка коштує 7. Скільки монет залишиться?",opts:[2,3,4],a:3,parent:"Можна використати справжні монети-замінники. Після відповіді запитай, що буде, якщо машинка коштує 8.",why:"10 − 7 = 3."},
{stage:"4 · Історії",title:"Супергерої",q:"Людина-павук зібрав 8 кристалів. Залізна людина — на 3 менше. Скільки кристалів у Залізної людини?",opts:[5,6,11],a:5,parent:"Перевіряємо перенос поняття «на три менше» в усну історію.",why:"8 − 3 = 5."},
{stage:"5 · Секретний код",title:"Перша цифра коду",q:"Є 9 деталей. Скільки треба прибрати, щоб залишилося 6?",opts:[2,3,4],a:3,parent:"Не підказуй. За потреби дозволь LEGO.",why:"9 − 6 = 3."},
{stage:"5 · Секретний код",title:"Друга цифра коду",q:"Червона команда має 7 очок, синя — 10. На скільки синя попереду?",opts:[2,3,4],a:3,parent:"Перевіряємо розуміння різниці без предметів.",why:"10 − 7 = 3."},
{stage:"5 · Секретний код",title:"Третя цифра коду",q:"Знайди два різні способи скласти 8 із двох додатних чисел. Натисни «Готово», коли назвеш обидва.",opts:["Готово"],a:"Готово",parent:"Наприклад, 5+3 та 6+2. Запиши в нотатках, чи зробив це самостійно.",why:"Наприклад: 5+3=8 і 6+2=8. Секретний код перших двох завдань: 3, 3; третя цифра — кількість названих способів (2)."}
];
const KEY="kiddo.math.lesson1.v1";let state={index:0,answers:{},records:{},summary:""};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
const $=id=>document.getElementById(id);let selected=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function record(){let i=state.index;state.records[i]={score:$("score").value,note:$("note").value,repeat:$("repeat").checked};state.summary=$("summary").value;save()}
function render(){const i=state.index,t=tasks[i],r=state.records[i]||{};selected=state.answers[i]??null;$("bar").style.width=((i+1)/tasks.length*100)+"%";$("counter").textContent="Завдання "+(i+1)+" із "+tasks.length;$("stage").textContent=t.stage;$("title").textContent=t.title;$("question").textContent=t.q;$("parent").textContent=t.parent;$("score").value=r.score??"";$("note").value=r.note??"";$("repeat").checked=!!r.repeat;$("summary").value=state.summary||"";$("feedback").textContent="";$("explanation").textContent=t.why;$("explanation").classList.add("hide");$("visual").innerHTML="";if(t.tiles){let div=document.createElement("div");div.className="tiles";t.tiles.forEach((n,j)=>{let row=document.createElement("div");row.style.width="100%";row.className="tiles";for(let k=0;k<n;k++){let el=document.createElement("div");el.className="tile"+(j?" blue":"");el.textContent="●";el.title="Натисни, щоб позначити пару";el.onclick=()=>el.classList.toggle("off");row.appendChild(el)}div.appendChild(row)});$("visual").appendChild(div)}$("choices").innerHTML="";t.opts.forEach(v=>{let b=document.createElement("button");b.textContent=v;b.className=selected===v?"selected":"";b.onclick=()=>{selected=v;state.answers[i]=v;save();renderChoices()};$("choices").appendChild(b)});$("prev").disabled=i===0;$("next").textContent=i===tasks.length-1?"Завершити →":"Далі →"}
function renderChoices(){[...$("choices").children].forEach((b,j)=>b.className=selected===tasks[state.index].opts[j]?"selected":"")}
$("check").onclick=()=>{const t=tasks[state.index];$("feedback").textContent=selected===null?"Спочатку обери відповідь.":selected===t.a?"✅ Чудово!":"Спробуй ще раз або перевір із LEGO.";};
$("reveal").onclick=()=>$("explanation").classList.toggle("hide");
$("prev").onclick=()=>{record();state.index=Math.max(0,state.index-1);save();render();window.scrollTo(0,0)};
$("next").onclick=()=>{record();if(state.index<tasks.length-1){state.index++;save();render();window.scrollTo(0,0)}else{document.querySelector("section.card:last-of-type").scrollIntoView({behavior:"smooth"})}};
["score","note","repeat"].forEach(id=>$(id).addEventListener("change",record));$("note").addEventListener("input",record);$("summary").addEventListener("input",()=>{state.summary=$("summary").value;save()});
function report(){record();return {lesson:"Математична лабораторія — урок 1",date:new Date().toISOString().slice(0,10),summary:state.summary,results:tasks.map((t,i)=>({number:i+1,stage:t.stage,title:t.title,answer:state.answers[i]??null,expected:t.a,...(state.records[i]||{})}))}}
$("export").onclick=()=>{let data=JSON.stringify(report(),null,2);let blob=new Blob([data],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="math-lesson-1-results.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$("exportStatus").textContent="Файл підготовлено. Якщо iPad блокує завантаження, скористайся кнопкою «Скопіювати звіт»."};
$("copy").onclick=async()=>{let s=JSON.stringify(report(),null,2);try{await navigator.clipboard.writeText(s);$("exportStatus").textContent="Звіт скопійовано. Встав його в чат."}catch(e){$("exportStatus").textContent="Не вдалося скопіювати автоматично — спробуй експорт."}};
render();
</script></body></html>
